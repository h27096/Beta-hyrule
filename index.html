<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beta Hyrule</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  ❤️ <span id="hearts">3</span>
  🏹 Arrows: <span id="arrows">10</span>
  🗝 Key: <span id="key">0</span>
</div>

<div id="touchControls">
  <div class="dpad">
    <button data-dir="up">⬆️</button>
    <button data-dir="left">⬅️</button>
    <button data-dir="down">⬇️</button>
    <button data-dir="right">➡️</button>
  </div>
  <div class="actions">
    <button id="attack">⚔️</button>
    <button id="shield">🛡</button>
    <button id="bow">🏹</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
